<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ب-10 - طلب البدل العائلي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; direction: rtl; text-align: right; padding: 20px; }
        .form-header { text-align: center; padding-bottom: 20px; border-bottom: 3px solid #667eea; margin-bottom: 30px; }
        .form-header h1 { font-size: 1.8em; color: #333; margin-bottom: 10px; font-weight: bold; }
        .form-header p { font-size: 1em; color: #666; }
        .form-code { background: #f0f4ff; color: #667eea; padding: 10px 15px; border-radius: 4px; font-weight: bold; display: inline-block; margin-bottom: 20px; }
        .no-print { display: flex; gap: 10px; margin-bottom: 20px; padding: 15px; background: #f5f5f5; border-radius: 6px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; background: #667eea; color: white; transition: 0.2s; }
        .btn:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 2px 8px rgba(102,126,234,0.3); }
        .form-section { margin-bottom: 30px; padding: 20px; border: 1px solid #e0e0e0; border-radius: 6px; }
        .section-title { font-size: 1.1em; font-weight: bold; color: #333; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #667eea; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-group label { font-weight: 500; margin-bottom: 5px; color: #333; }
        .form-group input, .form-group select, .form-group textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .form-group textarea { min-height: 70px; resize: vertical; }
        .table-section { margin: 15px 0; overflow-x: auto; }
        .table-section table { width: 100%; border-collapse: collapse; }
        .table-section th { background: #f0f4ff; padding: 10px; text-align: right; border: 1px solid #ddd; }
        .table-section td { padding: 10px; border: 1px solid #ddd; }
        .signature-block { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 40px; padding-top: 20px; border-top: 1px solid #e0e0e0; }
        .signature-item { text-align: center; }
        .signature-line { border-bottom: 1px solid #333; height: 60px; margin-bottom: 10px; }
        .signature-label { font-size: 0.9em; color: #333; }
        .date-line { font-size: 0.9em; color: #333; margin-top: 10px; }
        @media print { .no-print { display: none !important; } body { padding: 0; } input, select, textarea { border: none; border-bottom: 1px solid #000; background: transparent; } }
        @media (max-width: 768px) { .form-header h1 { font-size: 1.4em; } .signature-block { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="form-header">
        <h1>طلب استحقاقات البدل العائلي</h1>
        <p>الجيش اللبناني - إدارة المزايا</p>
    </div>
    
    <div class="form-code">النموذج: ب-10</div>
    
    <div class="no-print">
        <button class="btn" onclick="window.print()">🖨️ طباعة</button>
        <button class="btn" onclick="downloadForm()">⬇️ تحميل</button>
        <button class="btn" onclick="shareForm()">📤 مشاركة</button>
    </div>
    
    <div class="form-section">
        <div class="section-title">١. معلومات الموظف</div>
        <div class="form-group">
            <label for="name">الاسم الكامل</label>
            <input type="text" id="name" placeholder="أدخل الاسم">
        </div>
        <div class="form-group">
            <label for="rank">الرتبة</label>
            <input type="text" id="rank">
        </div>
        <div class="form-group">
            <label for="salary">الراتب الأساسي</label>
            <input type="number" id="salary" placeholder="أدخل الراتب">
        </div>
    </div>
    
    <div class="form-section">
        <div class="section-title">٢. أفراد الأسرة المعالين</div>
        <div class="form-group">
            <label for="dependents">عدد المعالين</label>
            <input type="number" id="dependents" placeholder="أدخل العدد" min="1">
        </div>
        
        <div class="table-section">
            <table>
                <thead>
                    <tr>
                        <th>الرقم</th>
                        <th>الاسم</th>
                        <th>السن</th>
                        <th>العلاقة</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td><input type="text" style="width: 100%; border: none; padding: 2px;"></td>
                        <td><input type="number" style="width: 60px; border: none; padding: 2px;"></td>
                        <td><input type="text" style="width: 80px; border: none; padding: 2px;"></td>
                        <td><select style="width: 100%; border: none; padding: 2px;"><option>---</option><option>ابن</option><option>ابنة</option><option>زوجة</option></select></td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td><input type="text" style="width: 100%; border: none; padding: 2px;"></td>
                        <td><input type="number" style="width: 60px; border: none; padding: 2px;"></td>
                        <td><input type="text" style="width: 80px; border: none; padding: 2px;"></td>
                        <td><select style="width: 100%; border: none; padding: 2px;"><option>---</option><option>ابن</option><option>ابنة</option><option>زوجة</option></select></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <div class="form-section">
        <div class="section-title">٣. المزايا الحالية</div>
        <div class="form-group">
            <label for="currentBenefits">المبالغ المستحقة حالياً</label>
            <textarea id="currentBenefits" placeholder="اذكر المبالغ والمزايا المستحقة حالياً"></textarea>
        </div>
    </div>
    
    <div class="form-section">
        <div class="section-title">٤. طلب الإضافة</div>
        <div class="form-group">
            <label for="requestedAmount">المبلغ الإضافي المطلوب</label>
            <input type="number" id="requestedAmount" placeholder="أدخل المبلغ">
        </div>
        <div class="form-group">
            <label for="justification">التبرير</label>
            <textarea id="justification" placeholder="اشرح سبب طلب الإضافة"></textarea>
        </div>
    </div>
    
    <div class="signature-block">
        <div class="signature-item">
            <div class="signature-line"></div>
            <div class="signature-label">توقيع المتقدم</div>
            <div class="date-line">التاريخ: ________________</div>
        </div>
        <div class="signature-item">
            <div class="signature-line"></div>
            <div class="signature-label">مسؤول المزايا</div>
            <div class="date-line">التاريخ: ________________</div>
        </div>
    </div>
    
    <script>
        function downloadForm() {
            const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'طلب_البدل_العائلي_ب10.html';
            link.click();
        }
        function shareForm() {
            if (navigator.share) {
                navigator.share({ title: 'نموذج WatanyBot', text: 'طلب البدل العائلي', url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('تم نسخ الرابط');
            }
        }
    </script>
</body>
</html>
