# WatanyBot Community WebSocket proxy authority.
# This block must exist in both the standard and SSL cPanel userdata includes
# for koudama.com before rebuilding/reloading Apache.
<IfModule proxy_wstunnel_module>
  ProxyPass /ws/community ws://127.0.0.1:8015/ws/community retry=0 timeout=60
  ProxyPassReverse /ws/community ws://127.0.0.1:8015/ws/community
</IfModule>
