<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>WatanyBot — Connection Error</title>
  <style>
    body {
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      text-align: center;
      max-width: 500px;
      padding: 40px;
    }
    h1 { color: #f38ba8; font-size: 24px; }
    p { color: #a6adc8; line-height: 1.6; }
    code {
      display: block;
      background: #181825;
      padding: 12px;
      border-radius: 8px;
      margin: 16px 0;
      color: #89b4fa;
      font-size: 14px;
    }
    button {
      background: #89b4fa;
      color: #1e1e2e;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚠️ Cannot connect to Vite dev server</h1>
    <p>Make sure the Vite dev server is running on port 5174:</p>
    <code>cd apps/web-user && pnpm dev</code>
    <p>Then click the button below to retry.</p>
    <button onclick="window.location.reload()">🔄 Retry Connection</button>
  </div>
</body>
</html>
