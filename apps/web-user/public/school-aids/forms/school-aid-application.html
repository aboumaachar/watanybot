<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>طلب تقديم مساعدة مدرسية</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f8fafc;color:#111827;margin:0;padding:24px}main{max-width:860px;margin:auto;background:#fff;border:1px solid #cbd5e1;border-radius:18px;padding:24px;box-shadow:0 14px 34px rgba(15,23,42,.08)}h1{margin:0 0 8px;font-size:28px}.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:14px;padding:12px;margin:14px 0;line-height:1.8}.field{border-bottom:1px dotted #64748b;min-height:26px;margin:8px 0 14px}label{font-weight:bold;color:#334155}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{border:1px solid #cbd5e1;padding:10px;vertical-align:top}.signature{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}@media print{body{background:white;padding:0}main{box-shadow:none;border:0}.notice{border:1px solid #999}}</style></head><body><main><h1>طلب تقديم مساعدة مدرسية</h1><div class="notice">هذا قالب محلي داخل موطني لتنظيم الملف. يجب استبداله بالنموذج الرسمي المعتمد من الشؤون عند توفر النسخة الرسمية.</div><label>اسم صاحب العلاقة</label><div class="field"></div><label>الرتبة / الصفة</label><div class="field"></div><label>رقم الهاتف</label><div class="field"></div><label>اسم الطالب</label><div class="field"></div><label>اسم المدرسة / المعهد / الجامعة</label><div class="field"></div><label>الصف أو السنة الدراسية</label><div class="field"></div><table><tr><th>المستند</th><th>مرفق؟</th><th>ملاحظات</th></tr><tr><td>إفادة مدرسية / جامعية</td><td></td><td></td></tr><tr><td>افادة انهاء</td><td></td><td></td></tr><tr><td>مدرسة</td><td></td><td></td></tr><tr><td>جامعة</td><td></td><td></td></tr></table><div class="signature"><div><label>توقيع صاحب العلاقة</label><div class="field"></div></div><div><label>التاريخ</label><div class="field"></div></div></div><p style="color:#64748b;line-height:1.8">يراجع
