<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#12355B" />
  <title>WatanyBot — Offline</title>
  <style>
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f5f7fa;color:#172033;font-family:Inter,Tajawal,Cairo,system-ui,sans-serif}
    main{max-width:420px;padding:28px;border-radius:28px;background:#fff;box-shadow:0 24px 70px rgba(18,53,91,.16);text-align:center}
    .logo{width:64px;height:64px;margin:0 auto 16px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(135deg,#12355b,#1f5f8b);color:#fff;font-size:30px;font-weight:800}
    h1{margin:0 0 8px;font-size:24px}
    p{margin:0;color:#6b7280;line-height:1.7}
  </style>
</head>
<body>
  <main>
    <div class="logo">و</div>
    <h1>WatanyBot غير متصل حالياً</h1>
    <p>تحقق من الاتصال بالإنترنت ثم حاول مجدداً. لا يتم حفظ أو عرض معلومات خاصة في وضع عدم الاتصال.</p>
  </main>
</body>
</html>
